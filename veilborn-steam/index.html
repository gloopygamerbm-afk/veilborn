<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05030a" />
  <title>Veilborn</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #05030a; overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <!-- Phaser is bundled locally (needed for Steam/offline); falls back to CDN if lib/phaser.min.js is missing -->
  <script src="lib/phaser.min.js" onerror="document.write('<script src=&quot;https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js&quot;><\/script>')"></script>
  <script src="js/assets_data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
